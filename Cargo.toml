[package]
name = "cas-lib"
version = "0.7.2"
edition = "2021"
description = "A function wrapper layer for RustCrypto and Dalek-Cryptography. Intended to be used in FFI situations with a global heap deallactor at the top level project."
license = "Apache-2.0"
# Publish only what a consumer of the library needs, not workflows, tests,
# test vectors or editor config. Cargo adds Cargo.toml and Cargo.lock itself.
include = ["/src/**/*.rs", "/LICENSE", "/README.md", "/CHANGELOG.md", "/docs/EXAMPLES.md"]

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes-gcm = "0.11.1"
aes-gcm-siv = "0.12.1"
argon2 = "0.6.0"
bcrypt = "0.19.3"
blake2 = "0.11.0"
rsa = { version = "0.10", features = ["pkcs1v15"] }
# The crate's only OS RNG: rand_core 0.10 SysRng for RSA keys; getrandom::fill /
# fill_uninit for Ed25519 keys, SLH-DSA seeds, AEAD keys and nonces, and
# Argon2 / PBKDF2 salts.
getrandom = { version = "0.4", features = ["sys_rng"] }
scrypt = { version = "0.12.0", default-features = false, features = ["phc", "getrandom"] } # 0.12 has no default features
sha3 = "0.12.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
ascon-aead = "0.6.1"
hmac = "0.13.0"
sha2 = "0.11.2"
subtle = "2.6.1"
# 0.14.5 floor (#170): requires zstd-safe 8.4.0 / zstd-sys 2.2.0, above the patched
# versions for RUSTSEC-2026-0391 (zstd >=0.14.3), 0398/0403 (zstd-safe >=8.2.0) and
# 0410 (zstd-sys >=2.1.2) (#108), so downstream lockfiles can't resolve the
# vulnerable stack. 0.14 keeps the same default features, so `legacy` stays off.
zstd = { version = "0.14.5", default-features = false } # no `legacy`: pre-v0.8 frame decoders (#107)
# No `p256`: only X25519HkdfSha256 is used, and p256 pulls in crypto-bigint 0.5
# (RUSTSEC-2026-0387, #108).
hpke = { version = "0.15.1", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
uuid = { version = "1.10.0", features = ["v4"] }
pbkdf2 = "0.13.0"
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
slh-dsa = "0.0.3"  
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
ml-dsa = "0.1.1"
aes-kw = "0.3.1"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
curve25519-dalek = "5.0.0"

# RSA key generation (crypto-bigint / crypto-primes, used by `rsa`) is very
# slow unoptimized; keep it fast in dev and test builds.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

