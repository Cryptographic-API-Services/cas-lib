[package]
name = "cas-lib"
version = "0.5.1"
edition = "2021"
description = "A function wrapper layer for RustCrypto and Dalek-Cryptography. Intended to be used in FFI situations with a global heap deallactor at the top level project."
license = "Apache-2.0"

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes-gcm = "0.10.3"
aes-gcm-siv = "0.11.1"
argon2 = "0.5.2"
bcrypt = "0.19.3"
blake2 = "0.10.6"
rand = "0.8.6"
rsa = { version = "0.10", features = ["pkcs1v15"] }
getrandom = { version = "0.4", features = ["sys_rng"] } # rand_core 0.10 OS RNG for RSA key generation
scrypt = "0.11.0"
sha3 = "0.10.8"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
ascon-aead = "0.5.2"
hmac = "0.12.1"
sha2 = "0.10.8"
subtle = "2.6.1"
# 0.13.6 floor: requires zstd-safe 7.4.2 / zstd-sys 2.2.0, so downstream lockfiles
# can't resolve the stack hit by RUSTSEC-2026-0391/0398/0403/0410 (#108).
zstd = { version = "0.13.6", default-features = false } # no `legacy`: pre-v0.8 frame decoders (#107)
# No `p256`: only X25519HkdfSha256 is used, and p256 pulls in crypto-bigint 0.5
# (RUSTSEC-2026-0387, #108).
hpke = { version = "0.12.0", default-features = false, features = ["alloc", "x25519"] }
uuid = { version = "1.10.0", features = ["v4"] }
pbkdf2 = "0.12.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.13.0"
# hkdf 0.13 is built on digest 0.11, so it needs sha2 0.11; the rest of the crate is
# still on sha2 0.10. Drop this alias once `sha2` itself moves to 0.11.
sha2-hkdf = { package = "sha2", version = "0.11" }
chacha20poly1305 = "0.10.1"
slh-dsa = "0.0.3"  
ml-kem = { version = "0.3.3", features = ["getrandom", "zeroize"] }
ml-dsa = "0.1.1"
aes-kw = { version = "0.2.1", features = ["alloc"] }
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
curve25519-dalek = "4"

# RSA key generation (crypto-bigint / crypto-primes, used by `rsa`) is very
# slow unoptimized; keep it fast in dev and test builds.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

